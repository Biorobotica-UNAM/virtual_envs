#VRML_SIM R2025a utf8
# Independent Justina robot PROTO (extracted from a .wbt instance)

PROTO Justina [
  field SFVec3f    translation       0 0 0
  field SFRotation rotation          0 0 1 0
  field SFString   name              "base_link"
  field SFString   contactMaterial   "default"
  field SFNode     boundingObject    NULL
  field SFNode     physics           NULL
  field SFString   controller        "<generic>"
  field MFString   controllerArgs    [ ]
  field SFString   customData        ""
  field SFBool     supervisor        FALSE
  field SFBool     synchronization   TRUE
  field SFBool     selfCollision     FALSE
  field SFVec3f    linearVelocity   0 0 0
  field SFVec3f    angularVelocity  0 0 0
  # Optional: allow users to append extra nodes to the robot
  field MFNode     children          [ ]
]
{
  Robot {
    translation       IS translation
    rotation          IS rotation
    name              IS name
    contactMaterial   IS contactMaterial
    boundingObject    IS boundingObject
    physics           IS physics
    controller        IS controller
    controllerArgs    IS controllerArgs
    customData        IS customData
    supervisor        IS supervisor
    synchronization   IS synchronization
    selfCollision     IS selfCollision
    linearVelocity    IS linearVelocity
    angularVelocity   IS angularVelocity
    children [
      DEF base_link Solid {
            translation 0 0 0
            children [
              DEF base_link_visual Pose {
                translation 0 0 0.02
                children [
                  DEF base_link_visual CadShape {
                    url [
                      "../../../justina_description/meshes/robotino_low_poly/Robotino3_LowPoly.dae"
                    ]
                  }
                ]
              }
            ]
            name "base_link"
            boundingObject DEF base_link_visual Pose {
              translation 0 0 0.02
              children [
                DEF base_link_visual Mesh {
                  url [
                    "../../../justina_description/meshes/robotino_low_poly/Robotino3_Collider_LowPoly.dae"
                  ]
                }
              ]
            }
            physics NULL
          }
      
      # extra user-defined children (optional)
      Group {
        children IS children
      }
    ]
  }
}
